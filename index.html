<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú · La Terraza Grill House</title>
    <meta
      name="description"
      content="Menú de La Terraza Grill House: brochetas, picadas, hamburguesas a la parrilla, smash, cócteles y bebidas."
    />
    <meta name="theme-color" content="#121110" />
    <link rel="icon" href="img/logo.svg" type="image/svg+xml" />

    <!-- Tipografías del logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Yellowtail&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Encabezado con el logo -->
    <header class="header">
      <img
        class="header__logo"
        src="img/logo.svg"
        alt="La Terraza Grill House"
        width="966"
        height="531"
      />
      <p class="header__guion">Nuestro menú</p>
    </header>

    <!-- Barra de categorías (se llena desde js/main.js) -->
    <nav class="categorias" aria-label="Categorías del menú">
      <div class="categorias__enlaces" id="cats"></div>
    </nav>

    <!-- Buscador -->
    <div class="buscador">
      <label class="buscador__label" for="buscador">Buscar en el menú</label>
      <input
        class="buscador__input"
        id="buscador"
        type="search"
        placeholder="Buscar: hamburguesa, limonada, cholupa…"
        autocomplete="off"
      />
    </div>

    <!-- Aquí se dibuja el menú (desde js/main.js) -->
    <main class="menu" id="menu"></main>
    <button class="pedido-flotante">
      Ver pedido (<span class="pedido__contador">0</span>)
    </button>
    <aside class="panel-pedido" hidden>
      <h2>Tu pedido</h2>
      <ul class="panel-pedido__lista"></ul>
      <p class="panel-pedido__total"></p>
      <button class="panel-pedido__enviar">Enviar por Whatsapp</button>
      <button class="panel-pedido__cerrar">Cerrar</button>
    </aside>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
